workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: PokerPartnerASC

    environment:
      vars:
        XCODE_PROJECT: "PokerPartnerHUD.xcodeproj"
        XCODE_SCHEME: "PokerPartnerHUD"
        BUNDLE_ID: "com.costa.pokerpartner"
        APP_STORE_APPLE_ID: $APP_STORE_APPLE_ID
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set up keychain
        script: keychain initialize

      - name: Write persistent private key from env var
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" > $HOME/cert_key
          chmod 600 $HOME/cert_key

      - name: Fetch signing files (reuses cert tied to persistent key)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:$HOME/cert_key \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Use provisioning profiles
        script: xcode-project use-profiles

      - name: Set build number
        script: agvtool new-version -all $BUILD_NUMBER

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - costaneto2221@icloud.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
