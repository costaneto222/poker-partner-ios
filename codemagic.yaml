workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # After creating API key in App Store Connect, add it to Codemagic under
      # Teams → Integrations → Developer Portal and name it "PokerPartnerASC"
      app_store_connect: PokerPartnerASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.costa.pokerpartner
      vars:
        XCODE_PROJECT: "PokerPartnerHUD.xcodeproj"
        XCODE_SCHEME: "PokerPartnerHUD"
        # Set APP_STORE_APPLE_ID in Codemagic environment variables after
        # creating the app in App Store Connect (numeric app ID, e.g. "1234567890")
        APP_STORE_APPLE_ID: $APP_STORE_APPLE_ID
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Set build number
        script: |
          #!/bin/sh
          set -e
          # Use Codemagic's auto-incremented build number
          agvtool new-version -all $BUILD_NUMBER

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - costaneto2221@icloud.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
